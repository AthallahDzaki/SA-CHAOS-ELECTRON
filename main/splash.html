<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SA-CHAOS Updater</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #12141c;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            -webkit-app-region: drag;
            user-select: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .logo-container {
            position: relative;
            margin-bottom: 24px;
        }

        .logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            position: relative;
            z-index: 2;
            -webkit-app-region: no-drag;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.5));
        }

        .glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 130px;
            height: 130px;
            background: radial-gradient(circle, rgba(147, 112, 219, 0.5) 0%, rgba(147, 112, 219, 0) 70%);
            z-index: 1;
            animation: pulse 2.2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.4; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.4; }
        }

        .text-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 80%;
            text-align: center;
        }

        #status-text {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #ffffff;
            -webkit-app-region: no-drag;
        }

        #detail-text {
            font-size: 12px;
            font-weight: 500;
            color: #a0a5b8;
            margin-top: 5px;
            min-height: 16px;
            -webkit-app-region: no-drag;
        }

        .progress-container {
            width: 75%;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            overflow: hidden;
            margin-top: 14px;
            opacity: 0;
            transition: opacity 0.3s ease;
            -webkit-app-region: no-drag;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #7c4dff, #b388ff);
            border-radius: 6px;
            transition: width 0.25s ease;
            box-shadow: 0 0 10px rgba(124, 77, 255, 0.6);
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <div class="glow"></div>
        <img src="../favicon/favicon-32x32.png" alt="SA-CHAOS" class="logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><circle cx=\'50\' cy=\'50\' r=\'40\' fill=\'#7c4dff\'/><text x=\'50\' y=\'55\' font-family=\'Arial\' font-size=\'30\' fill=\'white\' text-anchor=\'middle\'>SA</text></svg>'">
    </div>
    
    <div class="text-container">
        <div id="status-text">Checking for updates...</div>
        <div id="detail-text"></div>
    </div>
    
    <div class="progress-container" id="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        ipcRenderer.on('updater-message', (event, data) => {
            if (!data) return;
            const statusEl = document.getElementById('status-text');
            const detailEl = document.getElementById('detail-text');
            const container = document.getElementById('progress-container');
            const bar = document.getElementById('progress-bar');

            if (data.status) {
                statusEl.innerText = data.status;
            }

            if (data.detail) {
                detailEl.innerText = data.detail;
            } else if (data.percent !== undefined) {
                detailEl.innerText = `${data.percent}%`;
            }

            if (data.percent !== undefined) {
                container.style.opacity = '1';
                bar.style.width = `${Math.min(100, Math.max(0, data.percent))}%`;
            }
        });
    </script>
</body>
</html>
